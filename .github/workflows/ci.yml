name: CI
on:
  push: {branches: [main]}
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.13", cache: pip, cache-dependency-path: "**/requirements*.txt"}
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Tests (SQLite)
        run: pytest -q
      - name: Tests (Postgres, the production database)
        run: pytest -q
        env: {TEST_DATABASE_URL: "postgresql://postgres:ci@localhost:5432/postgres"}
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_PASSWORD: ci}
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10

  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run build   # type-checks with tsc, then bundles

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t data-sentinel .
      - name: Container serves the app
        run: |
          docker run -d --name app -p 8000:8000 -e SECRET_KEY=ci-secret-key-0123456789 -e COOKIE_SECURE=false data-sentinel
          for i in $(seq 1 40); do curl -fs localhost:8000/api/health && break; sleep 2; done
          curl -fs localhost:8000/ | grep -q "Data Sentinel"
          curl -fs -X POST localhost:8000/api/auth/demo -c jar >/dev/null
          curl -fs -b jar localhost:8000/api/datasets | grep -q Meridian
